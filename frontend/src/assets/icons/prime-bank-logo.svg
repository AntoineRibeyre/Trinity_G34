<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F4E4BC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C5A028;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2744;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield/Building Icon -->
  <g transform="translate(10, 10)">
    <!-- Building columns -->
    <rect x="8" y="25" width="8" height="30" fill="url(#goldGradient)" rx="1"/>
    <rect x="22" y="25" width="8" height="30" fill="url(#goldGradient)" rx="1"/>
    <rect x="36" y="25" width="8" height="30" fill="url(#goldGradient)" rx="1"/>
    
    <!-- Roof/Triangle -->
    <polygon points="26,5 0,25 52,25" fill="url(#navyGradient)"/>
    
    <!-- Base -->
    <rect x="0" y="55" width="52" height="5" fill="url(#navyGradient)" rx="1"/>
    
    <!-- Gold accent line on roof -->
    <line x1="10" y1="22" x2="42" y2="22" stroke="url(#goldGradient)" stroke-width="2"/>
  </g>
  
  <!-- Bank Name -->
  <text x="80" y="38" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1a365d">PRIME</text>
  <text x="80" y="60" font-family="Georgia, serif" font-size="22" font-weight="normal" fill="#D4AF37" letter-spacing="8">BANK</text>
  
  <!-- Decorative line -->
  <line x1="80" y1="42" x2="175" y2="42" stroke="url(#goldGradient)" stroke-width="1"/>
</svg>


