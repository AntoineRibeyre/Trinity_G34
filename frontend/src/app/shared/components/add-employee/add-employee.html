<div class="add-team-dialog">

  <div class="title">
    {{ 'ADMIN.ALL.ADD_EMPLOYEE' | translate }}
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
    <div>
      <label class="form-label" for="firstName">{{'REGISTER.FIRST_NAME' | translate}}</label>
      <input
        type="text"
        id="firstName"
        formControlName="firstName"
        class="form-input"
        placeholder="First Name"
        required>
    </div>

    <div>
      <label class="form-label" for="lastName">{{'REGISTER.LAST_NAME' | translate}}</label>
      <input
        type="text"
        id="lastName"
        formControlName="lastName"
        class="form-input"
        placeholder="Name"
        required>
    </div>

    <div>
      <label class="form-label" for="email">{{ 'REGISTER.EMAIL' | translate}}</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-input"
        placeholder="votre@email.com"
        required>
    </div>

    <div>
      <label class="form-label" for="telephone">{{'REGISTER.PHONE_NUMBER' | translate}}</label>
      <input
        type="tel"
        id="telephone"
        formControlName="telephone"
        class="form-input"
        placeholder="0000000000"
        required>
    </div>

    <div class="password-container">
      <label class="form-label" for="password">{{'REGISTER.PASSWORD' | translate}}</label>
      <div class="password-input-wrapper">
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-input"
          placeholder="Password"
          (focus)="showPasswordRequirements = true"
          (blur)="showPasswordRequirements = false"
          required>

        <!-- Popover des pré-requis -->
        <div class="password-requirements" *ngIf="showPasswordRequirements">
          <div class="requirements-title">{{ 'REGISTER.PWD_REQUIREMENT' | translate}} :</div>
          <div class="requirements-list">
            <div
              *ngFor="let req of passwordRequirements"
              class="requirement-item"
              [ngClass]="{ 'met': isRequirementMet(req.key), 'not-met': !isRequirementMet(req.key) }">
          <span class="requirement-icon">
            {{ isRequirementMet(req.key) ? '✓' : '✗' }}
          </span>
              <span class="requirement-text">{{ req.label }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <label class="form-label" for="confirmPassword">{{'REGISTER.CONFIRM_PWD' | translate}}</label>
      <input
        type="password"
        id="confirmPassword"
        formControlName="confirmPassword"
        class="form-input"
        [ngClass]="{ 'input-error': passwordMismatch }"
        placeholder="Confirm Password"
        required>
      <p *ngIf="passwordMismatch" class="error-text">
        Les mots de passe ne correspondent pas
      </p>
    </div>

    <div class="buttons">
      <app-basic-text-button
        text="Cancel"
        color="#999999"
        width="12vw"
        (onClick)="dialog.close()">
      </app-basic-text-button>

      <app-basic-text-button
        text="Confirmer"
        color="#336CAA"
        width="12vw"
        [disabled]= "!this.registerForm.valid"
        (onClick)="onSubmit()">
      </app-basic-text-button>
    </div>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

  </form>
</div>
