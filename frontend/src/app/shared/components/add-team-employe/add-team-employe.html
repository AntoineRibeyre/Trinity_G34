<div class="add-team-dialog">

  <div class="title">
    {{ data.title }}
  </div>

  <div class="message">
    {{ data.message }}
  </div>

  <!-- Barre de recherche -->
  <div class="search-container">
    <app-basic-text-field
      placeholder="Rechercher"
      width="100%"
      [rows]="1"
      (textChange)="onSearchChange($event)"
      [showClearButton]="true">
    </app-basic-text-field>
  </div>

  <!-- Liste des employés avec checkboxes -->
  <div class="employee-list-container">
    <div class="employee-list">
      @for (option of filteredOptions; track option.value) {
        <div class="employee-item">
          <label class="employee-checkbox-label">
            <input
              type="checkbox"
              [checked]="isEmployeeSelected(option.value)"
              (change)="onEmployeeToggle(option.value, $event)"
              class="employee-checkbox">
            <span class="employee-name">{{ option.label }}</span>
          </label>
        </div>
      }
      @if (filteredOptions.length === 0) {
        <div class="no-results">
          Aucun employé trouvé
        </div>
      }
    </div>
  </div>

  <div class="buttons">
    <app-basic-text-button
      [text]="data.cancel"
      color="#999999"
      (click)="data.onCancel(dialog)"
      onKeyPress|onKeyDown|onKeyUp>
    </app-basic-text-button>

    <app-basic-text-button
      [text]="data.confirm"
      color="#336CAA"
      [disabled]="!isSelected"
      (click)="data.onConfirm(dialog, selectedEmployeeIds)"
      onKeyPress|onKeyDown|onKeyUp>
    </app-basic-text-button>
  </div>

</div>
