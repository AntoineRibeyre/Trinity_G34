<h2 class="title">{{ data.title }}</h2>

<form [formGroup]="form" class="form-container">

  <!-- Mot de passe -->
  <div class="input-group">
    <label>{{ 'SETTINGS.NEW_PASSWORD' | translate }}</label>

    <div class="password-wrapper">
      <input
        type="{{ hidePassword ? 'password' : 'text' }}"
        formControlName="password"
        placeholder="{{ 'SETTINGS.PLACEHOLDER_PASSWORD' | translate }}"
        (focus)="showPasswordRequirements = true"
      />
      <button type="button" class="toggle" (click)="hidePassword = !hidePassword">
        {{ hidePassword ? '👁️' : '🙈' }}
      </button>
    </div>

    <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('passwordStrength')">
      {{ 'SETTINGS.PASSWORD_INVALID' | translate }}
    </div>
  </div>

  <!-- Confirmation du mot de passe -->
  <div class="input-group">
    <label>{{ 'SETTINGS.CONFIRM_PASSWORD' | translate }}</label>

    <div class="password-wrapper">
      <input
        type="{{ hideConfirm ? 'password' : 'text' }}"
        formControlName="confirmPassword"
        placeholder="{{ 'SETTINGS.PLACEHOLDER_CONFIRM' | translate }}"
      />
      <button type="button" class="toggle" (click)="hideConfirm = !hideConfirm">
        {{ hideConfirm ? '👁️' : '🙈' }}
      </button>
    </div>

    <div class="error" *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
      {{ 'SETTINGS.PASSWORD_MISMATCH' | translate }}
    </div>
  </div>

  <!-- Prérequis du mot de passe avec votre logique -->
  <div class="password-requirements" *ngIf="showPasswordRequirements">
    <div class="requirements-title">{{ 'REGISTER.PWD_REQUIREMENT' | translate }} :</div>
    <div class="requirements-list">
      <div
        *ngFor="let req of passwordRequirements"
        class="requirement-item"
        [ngClass]="{ 'met': isRequirementMet(req.key), 'not-met': !isRequirementMet(req.key) }">
        <span class="requirement-icon">
          {{ isRequirementMet(req.key) ? '✓' : '✗' }}
        </span>
        <span class="requirement-text">{{ req.label | translate }}</span>
      </div>
    </div>
  </div>

  <!-- Boutons -->
  <div class="buttons">
    <button type="button" class="cancel" (click)="cancel()">
      {{ data.cancel }}
    </button>

    <button type="button" class="confirm" [disabled]="form.invalid" (click)="confirm()">
      {{ data.confirm }}
    </button>
  </div>

</form>
