<div class="delete-dialog">

  <div class="title">
    {{ data.title }}
  </div>

  <div class="message">
    {{ data.message }}
  </div>

  <app-basic-dropdown
    [options]="managersList"
    (onSelectionChange)="onChangeManager($event)"
  >
  </app-basic-dropdown>

  <div class="buttons">
    <app-basic-text-button
      text="{{ data.cancel }}"
      color="#999999"
      (onClick)="data.onCancel(dialog)">
    </app-basic-text-button>

    <app-basic-text-button
      text="{{ data.confirm }}"
      color="#336CAA"
      [disabled]="isManager"
      (onClick)="data.onConfirm(dialog, managerSelected)">
    </app-basic-text-button>
  </div>

</div>
