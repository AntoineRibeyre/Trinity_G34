<div class="">
  <h1 class="">Inscription</h1>
  <div class="" >
    <label for="first name">First Name</label> <!-- Nom-->
    <input type="text" id="first name" class="" placeholder="First Name" required>
  </div>

  <div class="" > <!-- Prenom-->
    <label for="name">Name</label>
    <input type="text" id="name" class="" placeholder="Name" required>
  </div>

  <div class="" > <!-- Email-->
    <label for="email">Email</label>
    <input type="email" id="email" class="" placeholder="votre@email.com" required>
  </div>

  <div class="" > <!-- Numéro de carte-->
    <label for="carte">Carte</label>
    <input type="text"
           id="carte"
           class="form-control"
           placeholder="Ex: 12345"
           formControlName="carte"
           pattern="[A-Za-z0-9-]+"
           required>
  </div>

  <div class="" > <!-- Mdp-->
    <label for="password">Password</label>
    <input type="password" id="password" class="" placeholder="Password" required>
  </div>

  <button class="btn btn-secondary">S'inscrire</button>

</div>
