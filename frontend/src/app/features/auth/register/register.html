<div class="general-space">
<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
  <h1 class="register-title">Inscription</h1>

  <div>
    <label class="form-label" for="firstName">First Name</label>
    <input
      type="text"
      id="firstName"
      formControlName="firstName"
      class="form-input"
      placeholder="First Name"
      required>
  </div>

  <div>
    <label class="form-label" for="lastName">Name</label>
    <input
      type="text"
      id="lastName"
      formControlName="lastName"
      class="form-input"
      placeholder="Name"
      required>
  </div>

  <div>
    <label class="form-label" for="email">Email</label>
    <input
      type="email"
      id="email"
      formControlName="email"
      class="form-input"
      placeholder="votre@email.com"
      required>
  </div>

  <div>
    <label class="form-label" for="telephone">Téléphone</label>
    <input
      type="tel"
      id="telephone"
      formControlName="telephone"
      class="form-input"
      placeholder="0000000000"
      required>
  </div>

  <div>
    <label class="form-label" for="password">Password</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      class="form-input"
      placeholder="Password"
      required>
  </div>

  <div>
    <label class="form-label" for="confirmPassword">Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      formControlName="confirmPassword"
      class="form-input"
      [ngClass]="{ 'input-error': passwordMismatch }"
      placeholder="Confirm Password"
      required>
    <p *ngIf="passwordMismatch" class="error-text">
      Les mots de passe ne correspondent pas
    </p>
  </div>


  <button class="btn-register" type="submit" [disabled]="isLoading">
    {{ isLoading ? 'Chargement...' : 'S\'inscrire' }}
  </button>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</form>
</div>
