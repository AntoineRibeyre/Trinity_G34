<div class="login-container">
  <div class="login-form">
    <h1 class="login-title">Bienvenu sur [insérer_nom]</h1>

  <form (submit)="onLogin(); $event.preventDefault()">
    <!-- Email -->
    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        class="form-control"
        placeholder="votre@email.com"
        name="email"
        [(ngModel)]="email"
        required>
    </div>

    <!-- Mot de passe -->
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        class="form-control"
        placeholder="••••••••"
        name="password"
        [(ngModel)]="password"
        required>
    </div>

    <!-- Boutons -->
    <button type="submit" class="btn btn-primary">Se connecter</button>
    <button type="button" class="btn btn-secondary" (click)="router.navigate(['/register'])">S'inscrire</button>
