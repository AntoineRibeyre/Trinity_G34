  <form (submit)="onLogin(); $event.preventDefault()" class="login-form">
    <h1 class="login-title">{{ "login.connexion"  }}</h1>
    <!-- Email -->
    <div>
      <label class="form-label" for="email">Email</label>
      <input
        type="email"
        id="email"
        class="form-input"
        placeholder="votre@email.com"
        name="email"
        [(ngModel)]="email"
        required>
    </div>

    <!-- Mot de passe -->
    <div>
      <label class="form-label" for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        class="form-input"
        placeholder="••••••••"
        name="password"
        [(ngModel)]="password"
        required>
    </div>

    <!-- Boutons -->
    <button type="submit" class="btn-login">Se connecter</button>
    <button type="button" class="signup-link" (click)="router.navigate(['/register'])">S'inscrire</button>
  </form>
