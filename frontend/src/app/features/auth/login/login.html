<div class="general-space">
  <form (submit)="onLogin(); $event.preventDefault()" class="login-form">
    <h1 class="login-title">{{ 'LOGIN.CONNEXION' | translate }}</h1>
    <!-- Email -->
    <div>
      <label class="form-label" for="email">{{'LOGIN.EMAIL' |translate }}</label>
      <input
        type="email"
        id="email"
        class="form-input"
        placeholder="votre@email.com"
        name="email"
        [(ngModel)]="email"
        required>
    </div>

    <!-- Mot de passe -->
    <div>
      <label class="form-label" for="password">{{ 'LOGIN.PASSWORD'| translate }}</label>
      <input
        type="password"
        id="password"
        class="form-input"
        placeholder="••••••••"
        name="password"
        [(ngModel)]="password"
        required>
    </div>

    <!-- Boutons -->
    <button type="submit" class="btn-login">{{'LOGIN.LOGIN' |translate }}</button>
    <button type="button" class="signup-link" (click)="router.navigate(['/home'])">{{'REGISTER.GO_HOME' | translate}}</button>
  </form>

  <div class="illustration">
  </div>
</div>
