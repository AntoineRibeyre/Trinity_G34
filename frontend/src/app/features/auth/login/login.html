<div class="login-container">
  <div class="login-form">
    <h1 class="login-title">Bienvenu sur [insérer_nom]</h1>

  <form (submit)="onLogin(); $event.preventDefault()">
    <!-- Email -->
    <div>
      <label class="form-label" for="email">Email</label>
      <input
        type="email"
        id="email"
        class="form-input"
        placeholder="votre@email.com"
        name="email"
        [(ngModel)]="email"
        required>
    </div>

    <!-- Mot de passe -->
    <div>
      <label class="form-label" for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        class="form-input"
        placeholder=""
        name="password"
        [(ngModel)]="password"
        required>
    </div>
  </form>

    <!-- Boutons -->
    <button type="submit" class="btn-login">Se connecter</button>
    <button type="button" class="btn-login" (click)="router.navigate(['/register'])">S'inscrire</button>
  </div>
</div>
