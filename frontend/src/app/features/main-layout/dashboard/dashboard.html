<div class="general-space">
  <div class="left-column">

    <div class="cards profil">
      <div class="profil-content">
        <div class="avatar-container">
          <div class="avatar-wrapper">
            <div class="avatar-img">
              <img
                [src]="getAvatarPath()"
                [alt]="currentUser?.firstName + ' ' + currentUser?.lastName"
                class="avatar-image"
              />
            </div>
          </div>
        </div>
        <div class="profil-info">
          <div class="greeting">
            {{ "DASHBOARD.HELLO" | translate}}, <br> <span class="user-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
          </div>
          <div class="work-mode-switch">
            <span class="switch-label" [class.active]="!isTelework">Présentiel</span>
            <label class="switch">
              <input type="checkbox" [checked]="isTelework" (change)="toggleWorkMode()">
              <span class="slider"></span>
            </label>
            <span class="switch-label" [class.active]="isTelework">Télétravail</span>
          </div>
        </div>
      </div>
    </div>

    <div class="cards date">
      <div class="date-element">
        <div class="days">
          {{day}}
        </div>
        <div class="week">
          <div>
            {{dayOfWeek}}
          </div>
          <div>
            {{month}}
          </div>
        </div>
      </div>

      <div class="time">
        <div>
          {{hour}}:
        </div>
        <div class="min">
          <div>
            {{minute}}
          </div>
          <div class="sec">
            {{second}}
          </div>
        </div>
      </div>
    </div>

    <div class="cards manager">
      <div class="manager-title">
        {{ "DASHBOARD.WORK_HOURS_TRACKING" | translate }}
      </div>

      <div class="time" [class.active]="isPointeArrivee">
        {{ dureeTotaleJournee }}
      </div>

      

      <div class="point-buttons">
        <button
          class="pointer start"
          [class.active]="!isPointeArrivee"
          [class.disabled]="isPointeArrivee"
          [disabled]="isPointeArrivee"
          (click)="pointerArrivee()">
          <span class="icon">▶</span>
          <span class="text">Start</span>
        </button>

        <button
          class="pointer end"
          [class.active]="isPointeArrivee"
          [class.disabled]="!isPointeArrivee"
          [disabled]="!isPointeArrivee"
          (click)="pointerSortie()">
          <span class="icon">⏸</span>
          <span class="text">End</span>
        </button>
      </div>
    </div>
  </div>

  <div class="historical-column">
    <app-historical-column></app-historical-column>
  </div>

  <div class="team-column">
    <app-team-column></app-team-column>
  </div>

</div>
