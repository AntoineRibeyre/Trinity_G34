<div class="general-space">
  <div class="left-column">

    <div class="cards profil">

    </div>

    <div class="cards date">
      <div class="date-element">
        <div class="days">
          {{day}}
        </div>
        <div class="week">
          <div>
            {{dayOfWeek}}
          </div>
          <div>
            {{month}}
          </div>
        </div>
      </div>

      <div class="time">
        <div>
          {{hour}}:
        </div>
        <div class="min">
          <div>
            {{minute}}
          </div>
          <div class="sec">
            {{second}}
          </div>
        </div>
      </div>
    </div>

    <div class="cards manager">
      <div class="manager-title">
        Suivi des heures travaillées
      </div>

      <div class="time">
        Time
      </div>

      <div class="point-buttons">
        <div class="pointer">
          Start
        </div>
        <div class="pointer">
          End
        </div>
      </div>
    </div>

  </div>

  <div class="cards right-column">

  </div>

  <div class="cards right-column">

  </div>

</div>
