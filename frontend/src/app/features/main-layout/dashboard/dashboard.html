<div class="general-space">
  <div class="left-column">

    <div class="cards profil">
      <button (click)="openDialog()"></button>
    </div>

    <div class="cards date">
      <div class="date-element">
        <div class="days">
          {{day}}
        </div>
        <div class="week">
          <div>
            {{dayOfWeek}}
          </div>
          <div>
            {{month}}
          </div>
        </div>
      </div>

      <div class="time">
        <div>
          {{hour}}:
        </div>
        <div class="min">
          <div>
            {{minute}}
          </div>
          <div class="sec">
            {{second}}
          </div>
        </div>
      </div>
    </div>

    <div class="cards manager">
      <div class="manager-title">
        {{ "DASHBOARD.WORK_HOURS_TRACKING" | translate }}
      </div>

      <div class="time" [class.active]="isPointeArrivee">
        {{ dureeTotaleJournee }}
      </div>

      <div class="point-buttons">
        <button
          class="pointer start"
          [class.active]="!isPointeArrivee"
          [class.disabled]="isPointeArrivee"
          [disabled]="isPointeArrivee"
          (click)="pointerArrivee()">
          <span class="icon">▶</span>
          <span class="text">Start</span>
        </button>

        <button
          class="pointer end"
          [class.active]="isPointeArrivee"
          [class.disabled]="!isPointeArrivee"
          [disabled]="!isPointeArrivee"
          (click)="pointerSortie()">
          <span class="icon">⏸</span>
          <span class="text">End</span>
        </button>
      </div>
    </div>
  </div>

  <div class="historical-column">
    <app-historical-column></app-historical-column>
  </div>

  <div class="team-column">
    <app-team-column></app-team-column>
  </div>

</div>
