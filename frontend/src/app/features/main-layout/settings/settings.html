<div class="settings-container">
  <div class="settings-content">
    <!-- Profile Section -->
    <div class="profile-section">
      <div class="profile-avatar" (click)="openAvatarDialog()" (keydown.enter)="openAvatarDialog()">
      <div class="profile-avatar-img">
        <img
          [src]="getAvatarPath()"
          alt="User avatar"
          class="avatar-image"
        />
      </div>
    </div>

    <!-- Settings Form -->
    <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()" class="settings-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="firstName">{{ 'SETTINGS.FIRST_NAME' | translate }}</label>
          <input
            type="text"
            id="firstName"
            formControlName="firstName"
            class="form-input"
            [readonly]="true"
            [ngClass]="{'invalid': isInvalid('firstName'), 'readonly': true}"
            [placeholder]="'SETTINGS.FIRST_NAME' | translate">
          <div *ngIf="isInvalid('firstName')" class="error-message">
            {{ 'SETTINGS.FIRST_NAME_REQUIRED' | translate }}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="lastName">{{ 'SETTINGS.LAST_NAME' | translate }}</label>
          <input
            type="text"
            id="lastName"
            formControlName="lastName"
            class="form-input"
            [readonly]="true"
            [ngClass]="{'invalid': isInvalid('lastName'), 'readonly': true}"
            [placeholder]="'SETTINGS.LAST_NAME' | translate">
          <div *ngIf="isInvalid('lastName')" class="error-message">
            {{ 'SETTINGS.LAST_NAME_REQUIRED' | translate }}
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">{{ 'SETTINGS.EMAIL' | translate }}</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-input"
          [readonly]="true"
          [ngClass]="{'invalid': isInvalid('email'), 'readonly': true}"
          [placeholder]="'SETTINGS.EMAIL' | translate">
        <div *ngIf="isInvalid('email')" class="error-message">
          {{ 'SETTINGS.EMAIL_INVALID' | translate }}
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="contractType">
            {{ 'SETTINGS.CONTRACT_TYPE' | translate }}
          </label>
          <input
            type="text"
            id="contractType"
            formControlName="contractType"
            class="form-input"
            [readonly]="true"
            [ngClass]="{'readonly': true}"
            [placeholder]="'SETTINGS.CONTRACT_TYPE' | translate">
        </div>

        <div class="form-group">
          <label class="form-label" for="socialSecurityNumber">
            {{ 'SETTINGS.SOCIAL_SECURITY_NUMBER' | translate }}
          </label>
          <input
            type="text"
            id="socialSecurityNumber"
            formControlName="socialSecurityNumber"
            class="form-input"
            [readonly]="true"
            [ngClass]="{'readonly': true}"
            [placeholder]="'SETTINGS.SOCIAL_SECURITY_NUMBER' | translate">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="annualSalary">
            {{ 'SETTINGS.ANNUAL_SALARY' | translate }}
          </label>
          <input
            type="text"
            id="annualSalary"
            formControlName="annualSalary"
            class="form-input"
            [readonly]="true"
            [ngClass]="{'readonly': true}"
            [placeholder]="'SETTINGS.ANNUAL_SALARY' | translate">
        </div>

        <div class="form-group">
          <label class="form-label" for="arrivalDate">
            {{ 'SETTINGS.ARRIVAL_DATE' | translate }}
          </label>
          <input
            type="date"
            id="arrivalDate"
            formControlName="arrivalDate"
            class="form-input"
            [readonly]="true"
            [ngClass]="{'readonly': true}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="leaveBalance">
          {{ 'SETTINGS.LEAVE_BALANCE' | translate }}
        </label>
        <input
          type="text"
          id="leaveBalance"
          formControlName="leaveBalance"
          class="form-input"
          [readonly]="true"
          [ngClass]="{'readonly': true}"
          [placeholder]="'SETTINGS.LEAVE_BALANCE' | translate">
      </div>

      <div class="form-group">
        <label class="form-label" for="telephone">{{'SETTINGS.PHONE' |translate }}</label>
        <input
        type="tel"
        id="telephone"
        formControlName="telephone"
        class="form-input"
        [ngClass]="{'invalid': isInvalid('telephone')}"
        [placeholder]="'SETTINGS.PHONE' |translate">
        <div *ngIf="isInvalid('telephone')" class="error-message">
          {{'SETTINGS.PHONE_INVALID' | translate}}
        </div>
      </div>

      <div class="form-group">
        <app-basic-text-button
          text="Changer votre mot de passe"
          color="#999999"
          width="100%"
          (buttonPressed)="openEditPassword()"
          (keydown.enter)="openEditPassword()">
        </app-basic-text-button>
      </div>

      <div class="form-group">
        <label class="form-label" for="language">{{ 'SETTINGS.LANGUAGE' | translate }}</label>
        <select
          id="language"
          class="form-select"
          [ngModel]="currentLanguage"
          [ngModelOptions]="{standalone: true}"
          (ngModelChange)="changeLanguage($event)">
          <option *ngFor="let lang of availableLanguages" [value]="lang.code">
            {{ lang.label }}
          </option>
        </select>
      </div>

      <button
        type="submit"
        class="btn-save"
        [disabled]="settingsForm.invalid || isLoading">
      <span *ngIf="!isLoading">{{ 'SETTINGS.SAVE' | translate }}</span>
      <span *ngIf="isLoading">{{ 'SETTINGS.SAVING' | translate }}</span>
    </button>
    </form>
  </div>
</div>
