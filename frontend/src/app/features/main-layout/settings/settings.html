<div class="settings-container">
  <div class="settings-content">
    <!-- Profile Section -->
    <div class="profile-section">
      <div class="profile-avatar" (click)="openAvatarDialog()" (keydown.enter)="openAvatarDialog()">
      <div class="profile-avatar-img">
        <img
          [src]="getAvatarPath()"
          alt="User avatar"
          class="avatar-image"
        />
      </div>
    </div>

      <!-- ================= FORM ================= -->
      <form
        [formGroup]="settingsForm"
        (ngSubmit)="onSubmit()"
        class="settings-form"
      >

        <!-- ================= BASIC INFO (READONLY) ================= -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="firstName">
              {{ 'SETTINGS.FIRST_NAME' | translate }}
            </label>
            <input
              id="firstName"
              class="form-input readonly"
              formControlName="firstName"
              readonly
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="lastName">
              {{ 'SETTINGS.LAST_NAME' | translate }}
            </label>
            <input
              id="lastName"
              class="form-input readonly"
              formControlName="lastName"
              readonly
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            {{ 'SETTINGS.EMAIL_PRO' | translate }}
          </label>
          <input
            id="email"
            class="form-input readonly"
            formControlName="email"
            readonly
          />
        </div>

        <!-- ================= EDITABLE ================= -->
        <div class="form-group">
          <label class="form-label" for="telephone">
            {{ 'SETTINGS.PHONE' | translate }}
          </label>
          <input
            id="telephone"
            type="tel"
            class="form-input"
            formControlName="telephone"
            [ngClass]="{ invalid: isInvalid('telephone') }"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="personalEmail">
            {{ 'SETTINGS.PERSONAL_MAIL' | translate }}
          </label>
          <input
            id="personalEmail"
            type="email"
            class="form-input"
            formControlName="personalEmail"
            [ngClass]="{ invalid: isInvalid('personalEmail') }"
          />
        </div>

        <!-- ================= FAMILY STATUS ================= -->
        <div class="form-group">
          <label class="form-label" for="familyStatus">
            {{ 'SETTINGS.FAMILY_SITUATION' | translate }}
          </label>
          <select
            id="familyStatus"
            class="form-select"
            formControlName="familyStatus"
          >
            <option value="" disabled>
              {{ 'SETTINGS.SELECT' | translate }}
            </option>
            <option
              *ngFor="let status of familyStatusOptions"
              [value]="status.value"
            >
              {{ status.label | translate }}
            </option>
          </select>
        </div>

        <!-- ================= IBAN ================= -->
        <div class="form-group">
          <label class="form-label" for="iban">
            {{ 'SETTINGS.IBAN' | translate }}
          </label>
          <input
            id="iban"
            type="text"
            class="form-input"
            formControlName="iban"
            placeholder="FR76 XXXX XXXX XXXX XXXX XXXX XXX"
            [ngClass]="{ invalid: isInvalid('iban') }"
          />
        </div>

        <!-- ================= READONLY RH ================= -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="contractType">
              {{ 'SETTINGS.CONTRACT' | translate }}
            </label>
            <input
              id="contractType"
              class="form-input readonly"
              formControlName="contractType"
              readonly
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="socialSecurityNumber">
              {{ 'SETTINGS.SOCIAL_NUMBER' | translate }}
            </label>
            <input
              id="socialSecurityNumber"
              class="form-input readonly"
              formControlName="socialSecurityNumber"
              readonly
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="annualSalary">
              {{ 'SETTINGS.SALARY' | translate }}
            </label>
            <input
              id="annualSalary"
              class="form-input readonly"
              formControlName="annualSalary"
              readonly
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="arrivalDate">
              {{ 'SETTINGS.ARRIVAL_DATE' | translate }}
            </label>
            <input
              id="arrivalDate"
              class="form-input readonly"
              formControlName="arrivalDate"
              readonly
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="leaveBalance">
            {{ 'SETTINGS.LEAVE' | translate }}
          </label>
          <input
            id="leaveBalance"
            class="form-input readonly"
            formControlName="leaveBalance"
            readonly
          />
        </div>

        <!-- ================= ADDRESS ================= -->
        <div formGroupName="address">
          <h4 class="section-title">{{ 'SETTINGS.ADDRESSE' | translate }}</h4>

          <div class="form-row">
            <input
              id="streetNumber"
              class="form-input"
              formControlName="streetNumber"
              [placeholder]= "'SETTINGS.ADDRESS.STREET_NUMBER' | translate"
            />
            <input
              id="streetName"
              class="form-input"
              formControlName="streetName"
              [placeholder]= "'SETTINGS.ADDRESS.STREET' | translate"
            />
          </div>

          <div class="form-row">
            <input
              id="postalCode"
              class="form-input"
              formControlName="postalCode"
              [placeholder]= "'SETTINGS.ADDRESS.POSTAL_CODE' | translate"
            />
            <input
              id="city"
              class="form-input"
              formControlName="city"
              [placeholder]= "'SETTINGS.ADDRESS.CITY' | translate"
            />
          </div>

          <input
            id="country"
            class="form-input"
            formControlName="country"
            [placeholder]= "'SETTINGS.ADDRESS.COUNTRY' | translate"
          />
        </div>

        <!-- ================= EMERGENCY CONTACT ================= -->
        <div formGroupName="emergencyContact">
          <h4 class="section-title">{{ 'SETTINGS.EMERGENCY_CONTACT' | translate }}</h4>

          <div class="form-group">

            <select
              id="emergencyTitle"
              class="form-select"
              formControlName="title"
            >
              <option value="" disabled>
                {{ 'SETTINGS.SELECT' | translate }}
              </option>
              <option *ngFor="let t of titleOptions" [value]="t.value">
                {{ t.label | translate }}
              </option>
            </select>
          </div>

          <div class="form-row">
            <input
              id="emergencyFirstName"
              class="form-input"
              formControlName="firstName"
              [placeholder]="'SETTINGS.EMERGENCY.FIRST_NAME' | translate"
            />
            <input
              id="emergencyLastName"
              class="form-input"
              formControlName="lastName"
              [placeholder]="'SETTINGS.EMERGENCY.LAST_NAME' | translate"
            />
          </div>

          <input
            id="emergencyRelation"
            class="form-input"
            formControlName="relation"
            [placeholder]="'SETTINGS.EMERGENCY.RELATION' | translate"
          />

          <input
            id="emergencyPhone"
            class="form-input"
            formControlName="phone"
            [placeholder]="'SETTINGS.EMERGENCY.PHONE_NUMBER' | translate"
          />
        </div>

        <!-- ================= PASSWORD ================= -->
        <div class="form-group">
          <app-basic-text-button
            text="Changer votre mot de passe"
            color="#999999"
            width="100%"
            (buttonPressed)="openEditPassword()"
          ></app-basic-text-button>
        </div>

        <!-- ================= LANGUAGE ================= -->
        <div class="form-group">
          <label class="form-label" for="language">
            {{ 'SETTINGS.LANGUAGE' | translate }}
          </label>
          <select
            id="language"
            class="form-select"
            [ngModel]="currentLanguage"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="changeLanguage($event)"
          >
            <option *ngFor="let lang of availableLanguages" [value]="lang.code">
              {{ lang.label }}
            </option>
          </select>
        </div>

        <!-- ================= SAVE ================= -->
        <button
          type="submit"
          class="btn-save"
          [disabled]="settingsForm.invalid || isLoading"
        >
          <span *ngIf="!isLoading">{{ 'SETTINGS.SAVE' | translate }}</span>
          <span *ngIf="isLoading">{{ 'SETTINGS.SAVING' | translate }}</span>
        </button>

      </form>
    </div>
  </div>
</div>
