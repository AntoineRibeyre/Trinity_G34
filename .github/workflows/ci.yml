
on:
  push:
    branches: [ "main", "Tests_and_CI"]
  pull_request:
    branches: [ "main"]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:

  # JOB 1: BUILD FRONTEND (Angular)
  # ==========================================
  build-frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint Angular code
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Build Angular application
        working-directory: ./frontend
        run: npm run build -- --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  
  # JOB 2: BUILD BACKEND (Django)
  # =========================================
  build-backend:
    name: Build Backend (Django)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python code style (flake8)
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Check Django configuration
        working-directory: ./backend
        run: |
          python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'


  # JOB 3: TESTS BACKEND (Django)
  # =========================================
  test-backend:
    name: Test Backend (Django)
    runs-on: ubuntu-latest
    needs: docker-build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            pg_isready -h postgres -p 5432 -U test_user && break
            echo "⏳ Waiting for PostgreSQL to be ready..."
            sleep 5
          done

      - name: Run migrations
        working-directory: ./backend
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          DEBUG: 'True'
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Run tests with coverage
        working-directory: ./backend
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing -v
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          DEBUG: 'True'
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Display coverage summary
        working-directory: ./backend
        run: |
          pip install coverage
          coverage report --show-missing


  # JOB 4: COVERAGE REPORT
  # =========================================
  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./coverage

      - name: Coverage Summary Comment (PR only)
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: ./coverage/coverage.xml

      - name: Check coverage threshold
        run: |
          echo "Coverage report generated successfully"
          echo "Minimum coverage threshold: 70%"
          

  # JOB 5: DOCKER BUILD 
  # =========================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for Docker build
        run: |
          cat << EOF > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=test_password
          POSTGRES_DB=mydatabase
          DJANGO_DB_NAME=mydatabase
          DJANGO_DB_USER=postgres
          DJANGO_DB_PASSWORD=test_password
          DJANGO_DB_HOST=db
          DJANGO_DB_PORT=5432
          SECRET_KEY=ci-test-secret-key-not-for-production
          DEBUG=True
          DJANGO_SETTINGS_MODULE=backend.settings
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=postgresql://postgres:test_password@db:5432/mydatabase
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose
        run: |
          docker compose build --no-cache

      - name: Verify Docker images
        run: |
          docker images
          echo "Docker images built successfully"

      - name: Test Docker Compose startup
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose logs
          docker compose down


  # JOB 6: ALL CHECKS PASSED
  # =========================================
  all-checks-passed:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend, coverage-report, docker-build]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.build-frontend.result }}" == "success" ]] && \
             [[ "${{ needs.test-backend.result }}" == "success" ]] && \
             [[ "${{ needs.coverage-report.result }}" == "success" ]] && \
             [[ "${{ needs.docker-build.result }}" == "success" ]]; then
            echo "✅ All checks passed successfully!"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Frontend: ${{ needs.build-frontend.result }}"
            echo "Backend Tests: ${{ needs.test-backend.result }}"
            echo "Coverage: ${{ needs.coverage-report.result }}"
            echo "Docker: ${{ needs.docker-build.result }}"
            exit 1
          fi