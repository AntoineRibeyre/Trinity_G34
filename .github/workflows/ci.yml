name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "Tests_and_CI"]
  pull_request:
    branches: [ "main"]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:

  # JOB 1: BUILD FRONTEND (Angular)
  # ==========================================
  build-frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Angular application
        working-directory: ./frontend
        run: npm run build -- --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  
  # JOB 2: BUILD BACKEND (Django)
  # =========================================
  build-backend:
    name: Build Backend (Django)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python code style (flake8)
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Check Django configuration
        working-directory: ./backend
        run: |
          python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
  
  # JOB 3: DOCKER BUILD 
  # =========================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for Docker build
        run: |
          cat << EOF > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=test_password
          POSTGRES_DB=mydatabase
          DJANGO_DB_NAME=mydatabase
          DJANGO_DB_USER=postgres
          DJANGO_DB_PASSWORD=test_password
          DJANGO_DB_HOST=localhost
          DJANGO_DB_PORT=5432
          SECRET_KEY=ci-test-secret-key-not-for-production
          DEBUG=True
          DJANGO_SETTINGS_MODULE=backend.settings
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=postgresql://postgres:test_password@db:5432/mydatabase
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose
        run: |
          docker compose build --no-cache

      - name: Verify Docker images
        run: |
          docker images
          echo "✅ Docker images built successfully"

      - name: Test Docker Compose startup
        run: |
          docker compose up
          docker compose ps
          docker compose logs
          echo "⏳ Waiting for services to start..."
          sleep 30
          docker compose ps
          docker compose down -v


  # JOB 4: TESTS BACKEND (Django)
  # =========================================
  test-backend:
    name: Test Backend (Django)
    runs-on: ubuntu-latest
    needs: build-backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U test_user; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            echo "⏳ Waiting for PostgreSQL to be ready... ($i/10)"
            sleep 2
          done

      - name: migrations
        working-directory: ./backend
        run: |
           python manage.py makemigrations --noinput
           python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          DEBUG: 'True'
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
  
      - name: Run tests with coverage
        working-directory: ./backend
        run: |
          echo "🧪 Running tests with coverage..."
          pytest --cov=trinity --cov=backend --cov-config=.coveragerc --cov-report=term-missing -v tests/
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          DEBUG: 'True'
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Display coverage summary in console
        working-directory: ./backend
        if: always()
        run: |
          echo "📊 ===== COVERAGE SUMMARY ====="
          coverage report --show-missing
        continue-on-error: true

      - name: Upload coverage XML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
        if: always()

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov/
        if: always()

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.1
        with:
          coverageFile: backend/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true


  # JOB 5: COVERAGE REPORT
  # =========================================
  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: test-backend
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download coverage XML
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: ./coverage
        continue-on-error: true

      - name: Download coverage HTML
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: ./coverage-html
        continue-on-error: true

      - name: Install coverage tool
        run: pip install coverage

      - name: Display detailed coverage report
        run: |
          echo "📊 ===== DETAILED COVERAGE REPORT ====="
          if [ -f ./coverage/coverage.xml ]; then
            echo "✅ Coverage XML generated"
            echo "📁 Coverage HTML report available in artifacts"
            echo ""
            echo "💡 To view the HTML report:"
            echo "   1. Go to Actions tab"
            echo "   2. Click on this workflow run"
            echo "   3. Download 'coverage-html' artifact"
            echo "   4. Open index.html in your browser"
          else
            echo "⚠️  No coverage.xml found"
          fi
        continue-on-error: true

      - name: Coverage Summary Comment (PR only)
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: ./coverage/coverage.xml
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          echo "📈 Coverage report generated successfully"
          echo "🎯 Minimum coverage threshold: 70%"

  # JOB 6: ALL CHECKS PASSED
  # =========================================
  all-checks-passed:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend, coverage-report, docker-build]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.build-frontend.result }}" == "success" ]] && \
             [[ "${{ needs.test-backend.result }}" == "success" ]] && \
             [[ "${{ needs.docker-build.result }}" == "success" ]]; then
            echo "✅ All checks passed successfully!"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Frontend: ${{ needs.build-frontend.result }}"
            echo "Backend Tests: ${{ needs.test-backend.result }}"
            echo "Coverage: ${{ needs.coverage-report.result }}"
            echo "Docker: ${{ needs.docker-build.result }}"
            exit 1
          fi